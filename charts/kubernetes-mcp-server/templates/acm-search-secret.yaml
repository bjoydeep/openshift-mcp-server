{{- if .Values.acmSearch.enabled }}
{{/*
  ACM search database credential auto-discovery.

  Finds the ACM namespace by looking up the MultiClusterHub CR, then prefers the
  read-only secret "search-postgres-mcp-readonly" (search-v2-operator >= ACM 5.0).
  Falls back to "search-postgres" for older hubs. Stores the resolved connection
  URL in a Secret; the deployment mounts it as ACM_SEARCH_DATABASE_URL.

  Set acmSearch.autoDiscover=false and acmSearch.databaseUrl explicitly to skip
  cluster lookups (useful for helm lint / helm template or non-ACM environments).
*/}}
{{- $databaseUrl := "" }}

{{- if .Values.acmSearch.autoDiscover }}
  {{- $mchList := lookup "operator.open-cluster-management.io/v1" "MultiClusterHub" "" "" }}
  {{- if $mchList.items }}
    {{- $mch := index $mchList.items 0 }}
    {{- $acmNamespace := $mch.metadata.namespace }}
    {{- $dbHost := printf "search-postgres.%s.svc.cluster.local" $acmNamespace }}

    {{- $mcpSecret := lookup "v1" "Secret" $acmNamespace "search-postgres-mcp-readonly" }}
    {{- if $mcpSecret }}
      {{- $dbUser := index $mcpSecret.data "database-user" | b64dec }}
      {{- $dbPass := index $mcpSecret.data "database-password" | b64dec }}
      {{- $dbName := index $mcpSecret.data "database-name" | b64dec }}
      {{- if and $dbUser $dbPass $dbName }}
        {{- $databaseUrl = printf "postgresql://%s:%s@%s:5432/%s" $dbUser $dbPass $dbHost $dbName }}
      {{- end }}
    {{- else }}
      {{/* Fallback: legacy admin secret for hubs predating search-v2-operator#737 */}}
      {{- $searchSecret := lookup "v1" "Secret" $acmNamespace "search-postgres" }}
      {{- if $searchSecret }}
        {{- $dbUser := index $searchSecret.data "database-user" | b64dec }}
        {{- $dbPass := index $searchSecret.data "database-password" | b64dec }}
        {{- $dbName := index $searchSecret.data "database-name" | b64dec }}
        {{- if and $dbUser $dbPass $dbName }}
          {{- $databaseUrl = printf "postgresql://%s:%s@%s:5432/%s" $dbUser $dbPass $dbHost $dbName }}
        {{- end }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- else }}
  {{- $databaseUrl = .Values.acmSearch.databaseUrl }}
{{- end }}

{{- if and (not $databaseUrl) (or .Release.IsInstall .Release.IsUpgrade) }}
  {{- if .Values.acmSearch.autoDiscover }}
    {{- fail "acm-search: could not discover database URL. Ensure ACM/MCE with Search is installed and a MultiClusterHub CR exists, or set acmSearch.autoDiscover=false and provide acmSearch.databaseUrl." }}
  {{- else }}
    {{- fail "acm-search: acmSearch.databaseUrl is required when acmSearch.autoDiscover=false." }}
  {{- end }}
{{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubernetes-mcp-server.fullname" . }}-acm-search
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubernetes-mcp-server.labels" . | nindent 4 }}
type: Opaque
data:
  database-url: {{ $databaseUrl | b64enc }}
{{- end }}
